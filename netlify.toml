# Netlify Configuration — HealthCure Diagnostics
# React SPA built with Vite + TypeScript

[build]
  # Run tsc type-check then Vite production build
  command = "npm run build"
  # Vite outputs to dist/ by default
  publish = "dist"
  # Node version
  environment = { NODE_VERSION = "20" }

[build.environment]
  # Public frontend vars are set via Netlify UI / environment variables
  # VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY are configured in Netlify dashboard
  NODE_ENV = "production"

# SPA routing — redirect all paths to index.html so React Router handles them
# Prevents 404 on direct navigation or browser refresh of client-side routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Cache static assets aggressively
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Deploy contexts
[context.production]
  command = "npm run build"

[context.deploy-preview]
  command = "npm run build"

[context.branch-deploy]
  command = "npm run build"
